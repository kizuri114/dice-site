<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骰子套装</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 55%, #172554 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e2e8f0;
    user-select: none;
    padding: 20px;
  }

  /* —— 奇幻背景层：图片铺满全屏，蒙版压暗保证文字可读 —— */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: #0f172a center/cover no-repeat;
    transition: opacity .3s ease;
  }
  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse at center, rgba(8,10,26,0.18) 0%, rgba(8,10,26,0.55) 100%),
      linear-gradient(rgba(8,10,26,0.30), rgba(8,10,26,0.42));
  }

  .wrap { width: 100%; max-width: 900px; text-align: center; }

  /* —— 旁白字幕（暗黑地牢 · 老祖） —— */
  .narration {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    max-width: 90vw;
    text-align: center;
    font-size: 50px;
    font-weight: 700;
    line-height: 1.35;
    color: #f4e3bb;
    text-shadow: 0 3px 14px rgba(0,0,0,.95), 0 0 34px rgba(0,0,0,.65);
    opacity: 0;
    transition: opacity .8s ease;
    pointer-events: none;
    padding: 18px 42px;
    border-radius: 18px;
    background: rgba(5, 8, 20, .5);
    backdrop-filter: blur(8px);
  }
  .narration.show { opacity: 1; }

  .tagline { font-size: 13px; color: #94a3b8; margin-top: 18px; }

  /* —— 骰子选择栏 —— */
  /* —— 布局：左（骰子）/ 中（核心区）/ 右（次数）三栏 —— */
  .board {
    display: grid;
    grid-template-columns: 100px 112px 420px 112px 100px;
    gap: 14px;
    align-items: center;
  }
  .func-col { width: 100px; margin-left: -40px; }
  .side-col {
    width: 112px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .col-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: #94a3b8;
    text-align: center;
    margin-bottom: 2px;
  }
  .chips { display: flex; flex-direction: column; gap: 10px; }
  .chip {
    padding: 10px 0;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    background: rgba(10, 16, 38, .55);
    color: #e2e8f0;
    cursor: pointer;
    transition: all .18s ease;
    text-align: center;
  }
  .chip:hover { background: rgba(255,255,255,.2); transform: translateY(-2px); }
  .chip .dname { display: block; font-weight: 600; }
  .chip .dsub { display: block; font-size: 11px; color: #64748b; margin-top: 2px; }
  .chip.active {
    background: linear-gradient(135deg, #e94560, #c62a45);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 6px 18px rgba(233,69,96,.45);
  }
  .chip.active .dsub { color: rgba(255,255,255,.75); }

  .count-btn {
    padding: 12px 0;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 14px;
    background: rgba(10, 16, 38, .55);
    color: #e2e8f0;
    cursor: pointer;
    transition: all .15s ease;
  }
  .count-btn:hover { background: rgba(255,255,255,.18); transform: translateY(-2px); }
  .count-btn.active {
    background: linear-gradient(135deg, #e94560, #c62a45);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 6px 18px rgba(233,69,96,.45);
  }
  .count-btn.disabled {
    opacity: .38;
    cursor: not-allowed;
  }
  .count-btn.disabled:hover { transform: none; }

  .func-btn {
    padding: 12px 0;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 14px;
    background: rgba(10, 16, 38, .55);
    color: #e2e8f0;
    cursor: pointer;
    transition: all .15s ease;
  }
  .func-btn:hover { background: rgba(255,255,255,.18); transform: translateY(-2px); }
  .func-btn.active {
    background: linear-gradient(135deg, #e94560, #c62a45);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 6px 18px rgba(233,69,96,.45);
  }

  /* —— 舞台 —— */
  .stage {
    width: 420px;
    max-width: 92vw;
    background: rgba(10, 16, 38, .72);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 26px;
    padding: 30px 24px 28px;
    box-shadow: 0 24px 50px rgba(0,0,0,.4);
    backdrop-filter: blur(8px);
  }

  .face-wrap { perspective: 700px; display: flex; justify-content: center; }
  .face {
    width: min(46vmin, 250px);
    aspect-ratio: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, filter .2s ease;
    filter: drop-shadow(0 16px 26px rgba(0,0,0,.45));
  }
  .face:hover { transform: translateY(-6px); filter: drop-shadow(0 22px 34px rgba(0,0,0,.55)); }
  .face svg { width: 100%; height: 100%; }

  .face.rolling { animation: shake .16s linear infinite; filter: drop-shadow(0 16px 26px rgba(233,69,96,.35)); }
  .face.roll-coin {
    animation: coinspin .95s cubic-bezier(.25,.6,.3,1), shake .16s linear infinite;
  }
  @keyframes shake {
    0%   { transform: rotate(0deg)   translate(0,0); }
    25%  { transform: rotate(-12deg) translate(-7px,3px); }
    50%  { transform: rotate(9deg)   translate(7px,-3px); }
    75%  { transform: rotate(-6deg)  translate(-5px,-4px); }
    100% { transform: rotate(11deg)  translate(5px,4px); }
  }
  @keyframes coinspin {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(1080deg); }
  }

  .result {
    margin: 24px auto 0;
    min-height: 62px;
    font-size: 22px;
  }
  .result .dname { color: #cbd5e1; font-weight: 500; }
  .result .num {
    font-size: 60px;
    font-weight: 800;
    color: #ffd166;
    margin: 0 10px;
    text-shadow: 0 4px 16px rgba(255,209,102,.35);
    line-height: 1.1;
    display: inline-block;
    vertical-align: middle;
  }
  .result .sub { font-size: 14px; color: #94a3b8; margin-top: 6px; }
  .result .idle { font-size: 15px; color: #94a3b8; }

  .roll-btn {
    margin-top: 20px;
    padding: 15px 52px;
    font-size: 18px;
    font-family: inherit;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, #e94560, #c62a45);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(233,69,96,.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .roll-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(233,69,96,.5); }
  .roll-btn:active { transform: translateY(0) scale(.97); }

  /* —— 背景/皮肤选择侧边栏 —— */
  .top-btns {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 30;
    display: flex;
    gap: 10px;
  }
  .bg-toggle {
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 24px;
    background: rgba(10,16,38,.6);
    backdrop-filter: blur(8px);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,.35);
    transition: all .15s ease;
  }
  .bg-toggle:hover { background: rgba(255,255,255,.18); transform: translateY(-1px); }
  .bg-toggle.off { opacity: .45; }

  .bg-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 40;
  }
  .bg-backdrop.open { opacity: 1; pointer-events: auto; }

  .bg-sidebar {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 300px;
    max-width: 88vw;
    background: rgba(10,16,38,.92);
    backdrop-filter: blur(14px);
    border-left: 1px solid rgba(255,255,255,.14);
    box-shadow: -20px 0 50px rgba(0,0,0,.45);
    z-index: 50;
    transform: translateX(105%);
    transition: transform .3s ease;
    display: flex;
    flex-direction: column;
    padding: 18px 16px;
  }
  .bg-sidebar.open { transform: translateX(0); }

  .bg-sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .bg-tabs {
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,.08);
    padding: 4px;
    border-radius: 12px;
  }
  .bg-tab {
    padding: 7px 13px;
    font-size: 13px;
    font-family: inherit;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    transition: all .15s ease;
  }
  .bg-tab.active {
    background: linear-gradient(135deg, #e94560, #c62a45);
    color: #fff;
  }
  .bg-close {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: all .15s ease;
  }
  .bg-close:hover { color: #fff; background: rgba(255,255,255,.12); }

  .bg-random {
    margin-bottom: 14px;
    padding: 11px;
    font-size: 14px;
    font-family: inherit;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #e94560, #c62a45);
    color: #fff;
    cursor: pointer;
    transition: all .15s ease;
  }
  .bg-random:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .bg-random:active { transform: translateY(0) scale(.98); }

  .bg-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    overflow-y: auto;
    flex: 1;
    padding: 2px;
  }
  .bg-card {
    position: relative;
    aspect-ratio: 16 / 10;
    border: 2px solid rgba(255,255,255,.16);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    background: rgba(255,255,255,.05);
    padding: 0;
    transition: all .15s ease;
  }
  .bg-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.4); }
  .bg-card.active {
    border-color: #ffd166;
    box-shadow: 0 0 0 2px rgba(255,209,102,.35);
  }
  .bg-card .thumb {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }
  .bg-card .thumb-name {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 5px 6px;
    font-size: 12px;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    text-align: center;
  }

  .bg-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .bg-panel.hidden { display: none; }

  .skin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    overflow-y: auto;
    flex: 1;
    padding: 2px;
  }
  .skin-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 8px;
    border: 2px solid rgba(255,255,255,.16);
    border-radius: 12px;
    background: rgba(255,255,255,.05);
    cursor: pointer;
    transition: all .15s ease;
  }
  .skin-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.4); }
  .skin-card.active {
    border-color: #ffd166;
    box-shadow: 0 0 0 2px rgba(255,209,102,.35);
  }
  .skin-preview {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    /* 背景/边框/文字颜色由 JS 按皮肤内联设置 */
  }
  .skin-name { font-size: 13px; color: #e2e8f0; }

  /* —— 历史记录（点击展开） —— */
  .history-block {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .history-toggle {
    padding: 10px 24px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 30px;
    background: rgba(10, 16, 38, .6);
    color: #e2e8f0;
    cursor: pointer;
    transition: all .15s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .history-toggle:hover { background: rgba(255,255,255,.16); transform: translateY(-1px); }
  .history-toggle .count { color: #ffd166; font-size: 12px; }
  .history-panel {
    width: min(100%, 560px);
    margin-top: 12px;
    background: rgba(10, 16, 38, .6);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 14px 16px;
    backdrop-filter: blur(6px);
    display: none;
  }
  .history-panel.open { display: block; }
  .history-list {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .history-list li {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.08);
    color: #e2e8f0;
  }
  .history-empty { color: #94a3b8; font-size: 13px; text-align: center; padding: 8px; }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="bg-overlay"></div>

  <div class="wrap">

    <div class="board">
      <!-- 功能区（暗骰等）：浮动在最左侧，不影响核心区居中 -->
      <aside class="side-col func-col">
        <div class="col-title">— 功能 —</div>
        <button class="func-btn" id="secretBtn" title="暗骰：掷出后结果以 ？？ 隐藏，再点一次骰子或按钮揭晓">暗骰</button>
        <button class="func-btn" id="advBtn" title="优势骰：投掷多次，取其中最好的一次结果">优势</button>
        <button class="func-btn" id="disBtn" title="劣势骰：投掷多次，取其中最差的一次结果">劣势</button>
      </aside>

      <!-- 骰子选择 -->
      <aside class="side-col">
        <div class="col-title">— 骰子 —</div>
        <div class="chips" id="chips"></div>
      </aside>

      <!-- 核心区：骰子 + 结果 + 按钮 -->
      <div class="stage">
        <div class="face-wrap">
          <div class="face" id="face" title="点击掷出"></div>
        </div>
        <div class="result" id="result"></div>
        <button class="roll-btn" id="rollBtn">投 掷</button>
      </div>

      <!-- 右栏：连续投掷次数 -->
      <aside class="side-col">
        <div class="col-title">— 次数 —</div>
        <button class="count-btn active" data-count="1">1x</button>
        <button class="count-btn" data-count="2">2x</button>
        <button class="count-btn" data-count="3">3x</button>
        <button class="count-btn" data-count="4">4x</button>
      </aside>
    </div>

    <div class="tagline">点击骰子或骰子下方按钮掷出</div>

    <!-- 历史记录：点击展开 -->
    <div class="history-block">
      <button class="history-toggle" id="historyToggle">📜 历史记录 <span class="count" id="historyCount"></span></button>
      <div class="history-panel" id="historyPanel">
        <ul class="history-list" id="history"></ul>
        <div class="history-empty" id="historyEmpty">还没有投掷记录</div>
      </div>
    </div>
  </div>

  <!-- 右下角按钮组 -->
  <div class="top-btns">
    <button class="bg-toggle" id="bgToggle" title="选择背景">🖼 背景</button>
    <button class="bg-toggle" id="skinToggle" title="选择骰子皮肤">🎨 皮肤</button>
    <button class="bg-toggle" id="soundToggle" title="开关音效">🔊 音效</button>
    <button class="bg-toggle" id="subtitleBtn" title="字幕开关">💬 字幕</button>
  </div>

  <!-- 旁白字幕（暗黑地牢 · 老祖） -->
  <div class="narration" id="narration"></div>

  <!-- 背景 / 皮肤 选择侧边栏 -->
  <div class="bg-backdrop" id="bgBackdrop"></div>
  <aside class="bg-sidebar" id="bgSidebar">
    <div class="bg-sidebar-header">
      <div class="bg-tabs">
        <button class="bg-tab active" data-panel="bg">🖼 背景</button>
        <button class="bg-tab" data-panel="skin">🎨 皮肤</button>
      </div>
      <button class="bg-close" id="bgClose" title="关闭">✕</button>
    </div>
    <div class="bg-panel" id="panelBg">
      <button class="bg-random" id="bgRandom">🎲 随机换背景</button>
      <div class="bg-grid" id="bgGrid"></div>
    </div>
    <div class="bg-panel hidden" id="panelSkin">
      <button class="bg-random" id="skinRandom">🎲 随机换皮肤</button>
      <div class="skin-grid" id="skinGrid"></div>
    </div>
  </aside>

<script>
/* ==================== 骰子定义 ==================== */
const DICE = [
  { key: 'coin', name: '硬币',     en: 'D2',   range: [1,2],   desc: '两面骰 · 正面/反面' },
  { key: 'd4',   name: '四面骰',   en: 'D4',   range: [1,4],   desc: '正三棱锥 · 1~4' },
  { key: 'd6',   name: '六面骰',   en: 'D6',   range: [1,6],   desc: '正方体 · 1~6' },
  { key: 'd8',   name: '八面骰',   en: 'D8',   range: [1,8],   desc: '正八面体 · 1~8' },
  { key: 'd10',  name: '十面骰',   en: 'D10',  range: [1,10],  desc: '十面体 · 1~10' },
  { key: 'd12',  name: '十二面骰', en: 'D12',  range: [1,12],  desc: '正十二面体 · 1~12' },
  { key: 'd20',  name: '二十面骰', en: 'D20',  range: [1,20],  desc: '正二十面体 · 1~20' },
  { key: 'd100', name: '百面骰',   en: 'D100', range: [1,100], desc: '两个十面骰 · 00~90 / 0~9', is100: true }
];

/* ==================== SVG 渲染 ==================== */
const SVG = (...inner) => `<svg viewBox="0 0 200 200" role="img" aria-hidden="true">${inner.join('')}</svg>`;

function T(x, y, size, content, fill = '#fff', weight = 800, opacity = 1, center = false) {
  const db = center ? ' dominant-baseline="central"' : '';
  return `<text x="${x}" y="${y}" text-anchor="middle"${db} font-size="${size}" font-weight="${weight}"
    fill="${fill}" opacity="${opacity}"
    style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))">${content}</text>`;
}
function grad(id, c1, c2) {
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`;
}

/* 皮肤参数：skin.faceTop/faceBot = 骰面渐变，skin.edge = 骰边色，skin.num = 数字色 */
function renderDie(die, o, skin) {
  const num = o.idleText || o.n || '?';
  const f = skin.faceTop, f2 = skin.faceBot, ed = skin.edge, nm = skin.num;
  switch (die.key) {

    case 'coin':
      return SVG(
        grad('gCoin', f, f2),
        `<circle cx="100" cy="100" r="90" fill="none" stroke="${ed}" stroke-width="7"/>`,
        `<circle cx="100" cy="100" r="86" fill="url(#gCoin)"/>`,
        `<circle cx="100" cy="100" r="68" fill="none" stroke="${ed}" stroke-width="3" stroke-dasharray="4 4" opacity=".65"/>`,
        `<circle cx="100" cy="100" r="57" fill="none" stroke="${ed}" stroke-width="2" opacity=".45"/>`,
        T(100, 118, o.idleText ? 40 : 56, num, nm)
      );

    case 'd4':
      return SVG(
        grad('gD4', f, f2),
        `<polygon points="100,8 188,180 12,180" fill="url(#gD4)" stroke="${ed}" stroke-opacity=".75" stroke-width="3"/>`,
        `<polygon points="100,40.1 163.4,164 36.6,164" fill="none" stroke="${ed}" stroke-opacity=".35" stroke-width="2"/>`,
        T(100, 122.7, o.idleText ? 40 : 54, num, nm, 800, 1, true)  // 居中对齐到三角形重心
      );

    case 'd6': {
      const layout = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
      const xy = [[60,60],[100,60],[140,60],[60,100],[100,100],[140,100],[60,140],[100,140],[140,140]];
      let body = '';
      if (o.idleText) {
        body = T(100, 100, 40, o.idleText, nm, 800, 1, true);  // 未投掷时的小标注，掷出后为点数
      } else if (o.hidden) {
        body = T(100, 100, 40, '?', nm, 800, 1, true);  // 暗骰未揭晓
      } else {
        body = layout[o.n].map(i =>
          `<circle cx="${xy[i][0]}" cy="${xy[i][1]}" r="17" fill="${nm}"
            style="filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))"/>`).join('');
      }
      return SVG(
        grad('gD6', f, f2),
        `<rect x="10" y="10" width="180" height="180" rx="24" fill="url(#gD6)" stroke="${ed}" stroke-opacity=".75" stroke-width="2"/>`,
        body
      );
    }

    case 'd8':
      return SVG(
        grad('gD8', f, f2),
        `<polygon points="100,10 188,100 100,190 12,100" fill="url(#gD8)" stroke="${ed}" stroke-opacity=".75" stroke-width="3"/>`,
        `<polygon points="100,37 161.6,100 100,163 38.4,100" fill="none" stroke="${ed}" stroke-opacity=".35" stroke-width="2"/>`,
        T(100, 114, o.idleText ? 40 : 54, num, nm)
      );

    case 'd10':  // 十面骰：菱形（正十面体）
      return SVG(
        grad('gD10', f, f2),
        `<polygon points="100,10 150,100 100,190 50,100" fill="url(#gD10)" stroke="${ed}" stroke-opacity=".75" stroke-width="3"/>`,
        `<polygon points="100,37 135,100 100,163 65,100" fill="none" stroke="${ed}" stroke-opacity=".35" stroke-width="2"/>`,
        T(100, 100, o.idleText ? 40 : 54, num, nm, 800, 1, true)
      );

    case 'd12':
      return SVG(
        grad('gD12', f, f2),
        `<polygon points="100,14 181.8,73.4 150.5,169.6 49.5,169.6 18.2,73.4"
          fill="url(#gD12)" stroke="${ed}" stroke-opacity=".75" stroke-width="3"/>`,
        `<polygon points="100,46.7 150.7,83.5 131.3,143.2 68.7,143.2 49.3,83.5"
          fill="none" stroke="${ed}" stroke-opacity=".35" stroke-width="2"/>`,
        T(100, 112, o.idleText ? 40 : 52, num, nm)
      );

    case 'd20':
      return SVG(
        grad('gD20', f, f2),
        `<polygon points="12,22 188,22 100,188" fill="url(#gD20)" stroke="${ed}" stroke-opacity=".75" stroke-width="3"/>`,
        `<polygon points="31.4,34.1 168.6,34.1 100,163.6" fill="none" stroke="${ed}" stroke-opacity=".35" stroke-width="2"/>`,
        T(100, 98, o.idleText ? 40 : 56, num, nm)
      );

    case 'd100': {
      const tens = o.tens ?? 0, units = o.units ?? 0;
      const tStr = o.idleText ? '?' : (o.hidden ? '?' : (tens === 0 ? '00' : String(tens * 10)));
      const uStr = o.idleText ? '?' : (o.hidden ? '?' : String(units));
      return SVG(
        grad('gD100', f, f2),
        /* 十位骰（左） */
        `<polygon points="67,18 116,100 67,182 18,100" fill="url(#gD100)" stroke="${ed}" stroke-opacity=".75" stroke-width="2.5"/>`,
        `<polygon points="67,41 102.3,100 67,159 31.7,100" fill="none" stroke="${ed}" stroke-opacity=".35" stroke-width="1.5"/>`,
        T(67, 106, 30, tStr, nm),
        /* 个位骰（右） */
        `<polygon points="133,18 182,100 133,182 84,100" fill="url(#gD100)" stroke="${ed}" stroke-opacity=".75" stroke-width="2.5"/>`,
        `<polygon points="133,41 168.3,100 133,159 97.7,100" fill="none" stroke="${ed}" stroke-opacity=".35" stroke-width="1.5"/>`,
        T(133, 106, 30, uStr, nm)
      );
    }
  }
}

/* ==================== 掷骰逻辑 ==================== */
const face      = document.getElementById('face');
const resultEl  = document.getElementById('result');
const chipsEl   = document.getElementById('chips');
const historyEl = document.getElementById('history');

let currentDie = 'd6';
let busy = false, rollTimer = null, flicker = null, lastRoll = null;
let rollCount = 1;  // 连续投掷次数：1x / 2x / 3x / 4x
let feature = 'none';      // 功能模式：'none' | 'secret' | 'adv' | 'dis'（互斥）
let secretMode = false;    // 由 feature 派生：feature === 'secret'
let pendingSecret = false; // 是否有一笔待揭晓的暗骰结果

const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

function buildChips() {
  chipsEl.innerHTML = '';
  DICE.forEach(d => {
    const b = document.createElement('button');
    b.className = 'chip' + (d.key === currentDie ? ' active' : '');
    b.innerHTML = `<span class="dname">${d.name}</span><span class="dsub">${d.en}</span>`;
    b.onclick = () => selectDie(d.key);
    chipsEl.appendChild(b);
  });
}

function stopRolling() {
  clearTimeout(rollTimer);
  clearInterval(flicker);
  face.classList.remove('rolling', 'roll-coin');
  busy = false;
}

function selectDie(key) {
  stopRolling();
  currentDie = key;
  pendingSecret = false;  // 切换骰子时放弃待揭晓的暗骰结果
  updateSecretUI();
  buildChips();
  showIdle();
}

function showIdle() {
  const die = DICE.find(d => d.key === currentDie);
  lastRoll = null;
  face.innerHTML = renderDie(die, { idleText: die.en }, getSkin());
  resultEl.innerHTML = '';  // 未投掷时不显示描述，只保留骰子上的标注（D2/D4/D6…）
}

function rollDie(die) {
  if (die.is100) {
    const tens  = randInt(0, 9);   // 十位：0~9 → 显示 00/10/20/.../90
    const units = randInt(0, 9);   // 个位：0~9
    const value = (tens === 0 && units === 0) ? 100 : tens * 10 + units;
    return { die, value, tens, units };
  }
  return { die, value: randInt(die.range[0], die.range[1]) };
}

function doRoll() {
  if (busy) return;
  busy = true;
  const die = DICE.find(d => d.key === currentDie);
  rollSequential(die, [], 0);  // 逐颗掷出，每颗都有独立动画
}

/* 连续投掷：一颗一颗地掷，每颗执行完整的摇晃动画后再定格 */
function rollSequential(die, results, idx) {
  resultEl.innerHTML = `<span class="idle">${rollCount > 1 ? `第 ${idx + 1} / ${rollCount} 次…` : '摇动中…'}</span>`;

  playRoll();  // 掷骰音
  face.classList.add('rolling');
  if (die.key === 'coin') face.classList.add('roll-coin');

  // 滚动时快速闪动随机的面
  flicker = setInterval(() => {
    if (die.is100) {
      const t = randInt(0, 9), u = randInt(0, 9);
      face.innerHTML = renderDie(die, { tens: t, units: u }, getSkin());
    } else {
      face.innerHTML = renderDie(die, { n: randInt(die.range[0], die.range[1]) }, getSkin());
    }
  }, 90);

  rollTimer = setTimeout(() => {
    clearInterval(flicker);
    playSettle();  // 落定音
    const r = rollDie(die);
    results.push(r);
    face.classList.remove('rolling', 'roll-coin');

    if (secretMode) {
      // 暗骰：每颗掷完只显示骰面，不显示结果行；只有最后一颗才显示 ？？
      face.innerHTML = renderDie(die, { hidden: true }, getSkin());
      if (idx + 1 >= rollCount) {
        resultEl.innerHTML = `<span class="dname">${die.name} · 暗骰</span> → <span class="num">？？</span>`;
      }
    } else {
      face.innerHTML = renderDie(die, die.is100 ? { tens: r.tens, units: r.units } : { n: r.value }, getSkin());
    }

    if (idx + 1 < rollCount) {
      // 短暂停留，再掷下一颗
      rollTimer = setTimeout(() => rollSequential(die, results, idx + 1), 380);
    } else {
      lastRoll = results;
      if (secretMode) {
        pendingSecret = true;
      } else {
        pendingSecret = false;
        showResult(die, results);
      }
      updateSecretUI();
      busy = false;
      // 功能旁白：暗骰 / 优势 / 劣势
      if (feature === 'secret') narrate(pick(NARR.secret));
      else if (feature === 'adv') narrate(pick(NARR.adv));
      else if (feature === 'dis') narrate(pick(NARR.dis));
    }
  }, 1100);
}

function showResult(die, results) {
  const sum  = results.reduce((a, r) => a + r.value, 0);
  const seq  = results.map(r => r.value).join(' + ');

  if (feature === 'adv' || feature === 'dis') {
    // 优势 / 劣势：取最大 / 最小
    const tag  = feature === 'adv' ? '优势' : '劣势';
    const verb = feature === 'adv' ? '最大' : '最小';
    const best = feature === 'adv'
      ? Math.max(...results.map(r => r.value))
      : Math.min(...results.map(r => r.value));
    resultEl.innerHTML =
      `<span class="dname">${die.name} × ${results.length} · ${tag}</span> → <span class="num">${best}</span>
       <div class="sub">掷出 ${seq}，${tag}取${verb} = ${best}</div>`;
  } else if (results.length > 1) {
    // 连续多次：显示每次结果与总和，如 4D6 → 4+2+5+3 = 14
    resultEl.innerHTML =
      `<span class="dname">${die.name} × ${results.length}</span> → <span class="num">${sum}</span>
       <div class="sub">${seq} = ${sum}</div>`;
  } else {
    const r = results[0];
    if (die.is100) {
      const tStr = r.tens === 0 ? '00' : String(r.tens * 10);
      resultEl.innerHTML =
        `<span class="dname">${die.name}</span> → <span class="num">${r.value}</span>
         <div class="sub">十位 ${tStr} ＋ 个位 ${r.units}${r.value === 100 ? '　(00 ＋ 0 = 100 🎉)' : ''}</div>`;
    } else {
      resultEl.innerHTML = `<span class="dname">${die.name}</span> → <span class="num">${r.value}</span>`;
    }
  }
  addHistory(die, results);
}

function addHistory(die, results) {
  // 按组记录：掷 1 次 → "1D6 → 3"，连续 4 次 → "4D6 → 14"，优势 → "2D6 优势 → 6"
  let text;
  if (feature === 'adv' || feature === 'dis') {
    const tag = feature === 'adv' ? '优势' : '劣势';
    const best = feature === 'adv'
      ? Math.max(...results.map(r => r.value))
      : Math.min(...results.map(r => r.value));
    text = `${results.length}${die.en} ${tag} → ${best}`;
  } else {
    const sum = results.reduce((a, r) => a + r.value, 0);
    text = `${results.length}${die.en} → ${sum}`;
    if (die.is100 && results.length === 1 && sum === 100) text += ' 🎉';
  }
  const li = document.createElement('li');
  li.textContent = text;
  historyEl.prepend(li);
  while (historyEl.children.length > 24) historyEl.lastChild.remove();
  historyEmpty.style.display = historyEl.children.length ? 'none' : '';
  historyCount.textContent = historyEl.children.length ? `(${historyEl.children.length})` : '';
}

/* —— 掷骰音效（Web Audio 合成，无需音频文件） —— */
let actx = null, soundOn = true;
function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function blip(t, freq, gain = 0.15, dur = 0.06) {
  const o = actx.createOscillator();
  o.type = 'triangle';
  o.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.01);
}
function clack(t, freq) {
  const dur = 0.04;
  const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * dur), actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = actx.createBufferSource(); s.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4;
  const g = actx.createGain(); g.gain.value = 0.35;
  s.connect(f).connect(g).connect(actx.destination);
  s.start(t); s.stop(t + dur);
  blip(t, freq, 0.1, 0.04);
}
function playRoll() {
  if (!soundOn) return;
  ensureAudio();
  if (!actx) return;
  let t = actx.currentTime + 0.02;
  for (let i = 0; i < 9; i++) {
    clack(t, 650 + Math.random() * 1000);
    t += 0.09 + Math.random() * 0.09;
  }
}
function playSettle() {
  if (!soundOn || !actx) return;
  const t = actx.currentTime + 0.01;
  blip(t, 1240, 0.16, 0.12);
  blip(t + 0.012, 1860, 0.1, 0.18);
}

const secretBtn = document.getElementById('secretBtn');

const rollBtn   = document.getElementById('rollBtn');
function updateSecretUI() {
  const pending = secretMode && pendingSecret;
  rollBtn.textContent = pending ? '揭 晓' : '投 掷';
  face.title = pending ? '点击揭晓' : '点击掷出';

/* —— 功能互斥：暗骰 / 优势 / 劣势 只能同时开启一个 —— */
function updateFeatureButtons() {
  secretBtn.classList.toggle('active', feature === 'secret');
  advBtn.classList.toggle('active', feature === 'adv');
  disBtn.classList.toggle('active', feature === 'dis');
}
function setFeature(mode) {
  feature = (feature === mode) ? 'none' : mode;
  secretMode = (feature === 'secret');
  updateFeatureButtons();
  applyCountConstraint();   // 优势/劣势下 1x 不可选
  updateSecretUI();

/* 优势 / 劣势要求至少投掷 2 次，1x 置灰不可选 */
function applyCountConstraint() {
  const oneBtn = document.querySelector('.count-btn[data-count="1"]');
  const restrict = (feature === 'adv' || feature === 'dis');
  oneBtn.disabled = restrict;
  oneBtn.classList.toggle('disabled', restrict);
  if (restrict && rollCount === 1) {
    rollCount = 2;  // 自动提升到 2x
    [...document.querySelectorAll('.count-btn')].forEach(b =>
      b.classList.toggle('active', parseInt(b.dataset.count, 10) === rollCount));
  }
}
function revealSecret() {
  pendingSecret = false;
  updateSecretUI();
  const die = DICE.find(d => d.key === currentDie);
  const results = lastRoll;
  if (!Array.isArray(results) || !results.length) return;
  const r = results[results.length - 1];
  face.innerHTML = renderDie(die, die.is100 ? { tens: r.tens, units: r.units } : { n: r.value }, getSkin());
  showResult(die, results);  // 显示真实结果并记入历史
}
secretBtn.addEventListener('click', () => setFeature('secret'));
advBtn.addEventListener('click', () => setFeature('adv'));
disBtn.addEventListener('click', () => setFeature('dis'));

face.addEventListener('click', onRollClick);
rollBtn.addEventListener('click', onRollClick);

/* —— 连续投掷次数（1x / 2x / 3x / 4x） —— */
document.querySelectorAll('.count-btn').forEach(b => {
  b.addEventListener('click', () => {
    rollCount = parseInt(b.dataset.count, 10);
    [...document.querySelectorAll('.count-btn')].forEach(x => x.classList.toggle('active', x === b));
  });
});

/* —— 历史记录展开 / 收起 —— */
const historyToggle = document.getElementById('historyToggle');
const historyPanel  = document.getElementById('historyPanel');
const historyCount  = document.getElementById('historyCount');
const historyEmpty  = document.getElementById('historyEmpty');
historyToggle.addEventListener('click', () => historyPanel.classList.toggle('open'));

buildChips();
buildBgGrid();
buildSkinGrid();
updateFeatureButtons();
applyCountConstraint();
setBg(Math.floor(Math.random() * BG.length));     // 每次打开自动随机挑一个背景
setSkin(Math.floor(Math.random() * SKINS.length)); // 每次打开自动随机挑一款皮肤
showIdle();
setTimeout(() => narrate(pick(NARR.open)), 600);  // 打开网页时的老祖旁白
</script>
